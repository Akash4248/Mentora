name: offline_tutor_app
description: "Separate offline AI tutor app scaffold with course-first architecture"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^12.0.0-beta.5
  crypto: ^3.0.6
  qr_flutter: ^4.1.0
  share_plus: ^13.1.0
  video_player: ^2.8.2
  math_expressions: ^3.1.0
  open_filex: ^4.5.0
  flutter_pdfview: ^1.4.1+1
  syncfusion_flutter_pdf: ^33.2.10
  archive: ^4.0.9
  multicast_dns: ^0.3.3
  network_info_plus: ^8.1.0
  shared_preferences: ^2.5.3
  flutter_dotenv: ^6.0.1
  sensors_plus: ^7.0.0
  device_info_plus: ^13.1.0
  permission_handler: ^12.0.3
  connectivity_plus: ^7.1.1
  uuid: ^4.5.3
  geolocator: ^14.0.2
  workmanager: ^0.9.0+3
  battery_plus: ^7.0.0
  flame: ^1.37.0
  flame_forge2d: ^0.19.2+6
  flutter_svg: ^2.3.0
  record: ^6.2.1
  just_audio: ^0.9.43
  flutter_riverpod: ^2.6.1
  web_socket_channel: ^3.0.2
  flutter_inappwebview: ^6.1.5
  google_fonts: ^8.2.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/experiment_scenes/
    - assets/asset_registry.json
    - assets/experiment_blueprints/
    - assets/seed_data_math_science.json
    - assets/chapter_video_resources.json
    - assets/curriculum_256_chapters.json
    - assets/phet/catalog.json
    - assets/phet/simulations/

hooks:
  user_defines:
    sqlite3:
      source: system

